<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    div { max-width: 400px; }
    h1 { font-size: 3rem; color: #38bdf8; margin-bottom: 8px; }
    p { color: #94a3b8; margin-bottom: 20px; }
    a { color: #38bdf8; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page doesn't exist — maybe it got deployed to the wrong bucket.</p>
    <a href="/">← Back home</a>
  </div>
</body>
</html>
